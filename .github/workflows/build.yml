name: Build NeuralRR ReShade Addon

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Missing ReShade & CUDA Headers
      shell: pwsh
      run: |
        # 1. Create folder for official CUDA runtime headers
        New-Item -ItemType Directory -Force -Path "cuda_headers"

        # 2. Download Official ReShade Headers directly into your existing include/ folder
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/crosire/reshade/main/include/reshade.hpp" -OutFile "include/reshade.hpp"
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/crosire/reshade/main/include/reshade_api.hpp" -OutFile "include/reshade_api.hpp"
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/crosire/reshade/main/include/reshade_api_device.hpp" -OutFile "include/reshade_api_device.hpp"
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/crosire/reshade/main/include/reshade_api_pipeline.hpp" -OutFile "include/reshade_api_pipeline.hpp"
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/crosire/reshade/main/include/reshade_api_resource.hpp" -OutFile "include/reshade_api_resource.hpp"

        # 3. Download Official CUDA Runtime Headers from NVIDIA GitHub Mirror
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/NVIDIA/cuda-samples/master/Common/cuda_runtime.h" -OutFile "cuda_headers/cuda_runtime.h"
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/NVIDIA/cuda-samples/master/Common/vector_types.h" -OutFile "cuda_headers/vector_types.h"
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/NVIDIA/cuda-samples/master/Common/driver_types.h" -OutFile "cuda_headers/driver_types.h"

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Compile ReShade Addon DLL
      shell: cmd
      run: |
        cl.exe /O2 /LD /std:c++17 neuralrr_main.cpp ^
          /I"include" ^
          /I"cuda_headers" ^
          /link ^
          /LIBPATH:"lib" ^
          nvinfer.lib cudart.lib ^
          /OUT:neuralrr.addon64

    - name: Upload Compiled Binary
      uses: actions/upload-artifact@v4
      with:
        name: neuralrr-addon64
        path: neuralrr.addon64

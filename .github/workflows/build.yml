name: Build NeuralRR ReShade Addon

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Official ReShade Headers
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "include"
        $reshadeFiles = @(
            "reshade.hpp",
            "reshade_events.hpp",
            "reshade_api.hpp",
            "reshade_api_device.hpp",
            "reshade_api_pipeline.hpp",
            "reshade_api_resource.hpp",
            "reshade_api_format.hpp",
            "reshade_api_type.hpp"
        )
        foreach ($file in $reshadeFiles) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/crosire/reshade/main/include/$file" -OutFile "include/$file"
        }
    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Compile ReShade Addon DLL
      shell: cmd
      run: |
        cl.exe /O2 /LD /std:c++17 neuralrr_main.cpp ^
          /I"include" ^
          /link ^
          /LIBPATH:"lib" ^
          nvinfer.lib cudart.lib ^
          /OUT:neuralrr.addon64

    - name: Upload Compiled Binary
      uses: actions/upload-artifact@v4
      with:
        name: neuralrr-addon64
        path: neuralrr.addon64

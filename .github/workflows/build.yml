name: Build NeuralRR ReShade Addon

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clone Official ReShade Headers
      shell: pwsh
      run: |
        git clone --depth 1 https://github.com/crosire/reshade.git reshade_repo
        New-Item -ItemType Directory -Force -Path "include"
        Copy-Item -Recurse -Force "reshade_repo/include/*" "include/"
        Remove-Item -Recurse -Force "reshade_repo"

    - name: Download Missing CUDA API Headers for TensorRT
      shell: pwsh
      run: |
        $cudaFiles = @(
            "cuda_runtime_api.h",
            "driver_types.h",
            "vector_types.h",
            "host_defines.h"
        )
        foreach ($file in $cudaFiles) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tpn/cuda-samples/master/v8.0/include/$file" -OutFile "include/$file"
        }

    - name: Fix CUDA Header Directory Structure & Patch
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "include/crt"
        if (Test-Path "include/host_defines.h") {
            Copy-Item -Force "include/host_defines.h" "include/crt/host_defines.h"
        }
        
        $headerPath = "include/cuda_runtime_api.h"
        if (Test-Path $headerPath) {
            $content = Get-Content $headerPath -Raw
            $content = $content -replace '#include\s+"cuda_device_runtime_api\.h"', '// #include "cuda_device_runtime_api.h"'
            $content = $content -replace '#include\s+<cuda_device_runtime_api\.h>', '// #include <cuda_device_runtime_api.h>'
            Set-Content $headerPath $content
        }

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Compile ReShade Addon DLL
      shell: cmd
      run: |
        cl.exe /O2 /LD /std:c++17 neuralrr_main.cpp ^
          /I"include" ^
          /link ^
          /LIBPATH:"lib" ^
          nvinfer.lib cudart.lib ^
          /OUT:neuralrr.addon64

    - name: Upload Compiled Binary
      uses: actions/upload-artifact@v4
      with:
        name: neuralrr-addon64
        path: neuralrr.addon64

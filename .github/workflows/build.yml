name: Build NeuralRR ReShade Addon

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clone Official ReShade Headers
      shell: pwsh
      run: |
        git clone --depth 1 https://github.com/crosire/reshade.git reshade_repo
        New-Item -ItemType Directory -Force -Path "include"
        Copy-Item -Recurse -Force "reshade_repo/include/*" "include/"
        Remove-Item -Recurse -Force "reshade_repo"

    - name: Generate Minimal Self-Contained CUDA Stub Header for TensorRT
      shell: pwsh
      run: |
        # Remove any broken raw CUDA headers from include/ so they never loop
        $badHeaders = @("cuda_runtime.h", "cuda_runtime_api.h", "device_types.h", "host_defines.h", "driver_types.h", "vector_types.h")
        foreach ($h in $badHeaders) {
            if (Test-Path "include/$h") { Remove-Item -Force "include/$h" }
        }
        if (Test-Path "include/crt") { Remove-Item -Recurse -Force "include/crt" }

        # Create a clean, zero-dependency cuda_runtime_api.h stub that satisfies NvInferRuntimeBase.h
        $stub = @"
        #pragma once
        #include <cstdint>
        #include <cstddef>
        typedef int cudaError_t;
        typedef struct CUstream_st* cudaStream_t;
        typedef struct CUevent_st* cudaEvent_t;
        struct cudaDeviceProp { char name[256]; size_t totalGlobalMem; int major; int minor; };
        "@
        Set-Content -Path "include/cuda_runtime_api.h" -Value $stub

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Compile ReShade Addon DLL (Zero .lib Dependencies)
      shell: cmd
      run: |
        cl.exe /O2 /Oi /GL /LD /EHsc /std:c++17 neuralrr_main.cpp ^
          /I"include" ^
          /link /LTCG /OUT:neuralrr.addon64

    - name: Upload Compiled Binary
      uses: actions/upload-artifact@v4
      with:
        name: neuralrr-addon64
        path: neuralrr.addon64

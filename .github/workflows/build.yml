name: Build NeuralRR ReShade Addon

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download and Extract Official ReShade Headers
      shell: pwsh
      run: |
        $zipUrl = "https://github.com/crosire/reshade/archive/refs/heads/main.zip"
        Invoke-WebRequest -Uri $zipUrl -OutFile "reshade_src.zip"
        Expand-Archive -Path "reshade_src.zip" -DestinationPath "reshade_temp"
        
        # Move the official include folder into your workspace root
        Move-Item -Force -Path "reshade_temp/reshade-main/include" -Destination "include"
        
        # Clean up zip and temp files
        Remove-Item -Recurse -Force "reshade_temp"
        Remove-Item -Force "reshade_src.zip"

    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Compile ReShade Addon DLL
      shell: cmd
      run: |
        cl.exe /O2 /LD /std:c++17 neuralrr_main.cpp ^
          /I"include" ^
          /link ^
          /LIBPATH:"lib" ^
          nvinfer.lib cudart.lib ^
          /OUT:neuralrr.addon64

    - name: Upload Compiled Binary
      uses: actions/upload-artifact@v4
      with:
        name: neuralrr-addon64
        path: neuralrr.addon64
